<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity id="face" position="0 3.6 -4">
        <a-cone position="0.03 0 0" radius-bottom="0.1" rotation="90 5 0" color="#FF3333"></a-cone>
        <a-box position="0.2 0.15 -0.4" width="0.1" height="0.1" depth="0.1" rotation="-33 85 56" color="black"></a-box>
        <a-box position="-0.2 0.15 -0.4" width="0.1" height="0.1" depth="0.1" rotation="33 85 56" color="black"></a-box>
        <a-circle position="0 -0.4 -0.67" rotation="60 0 0" radius="0.5" color="black"></a-circle>
      </a-entity>

      <a-entity id="snow" position="0 1 -5">
        <a-sphere position="0 0 0" radius="1.25" color="white"></a-sphere>
        <a-sphere position="0 1.4 0" radius="1" color="white"></a-sphere>
        <a-sphere position="0 2.5 0" radius="0.7" color="white"></a-sphere>
      </a-entity>
      
      <a-entity id="hat" position="-0.02 4 -5" rotation="-2 0 5">
        <a-cylinder position="0 0 0" radius="0.7" height="0.05" color="#111111"></a-cylinder>
        <a-cylinder position="0 0.35 0" radius="0.5" height="0.7" color="#111111"></a-cylinder>
        <a-cylinder position="0 0.12 0" radius="0.51" height="0.1" color="white"></a-cylinder>
      </a-entity>

      <a-circle radius="2" position="-0.2 0.01 -4.5" rotation="-90 0 0" color="#ccccff"></a-circle>
      <a-circle radius="1" position="0.5 0.01 -3.2" rotation="-90 0 0" color="#ccccff"></a-circle>

      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      
      <a-entity environment="preset: egypt; dressingAmount: 30"></a-entity>
    
    </a-scene>
  </body>
</html>
