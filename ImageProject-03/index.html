<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="project3.js" defer></script>
  </head>
  <body>
    
    <a-scene light="defaultLightsEnabled: false" id="scene" fog="type: exponential; color: #010101; density: 0.00025">
      <a-assets>
        <a-asset-item id="streetlight" src="Assets/streetlight.glb"></a-asset-item>
        <img id="vebs" src="Assets/vebs.jpg"></img>
        <img id="sky" src="Assets/sky.jpg"></img>
      </a-assets>

      <a-sphere src="#vebs" repeat="1.8 1" position="-1 1 -5"></a-sphere>

      <a-entity light="type: ambient; intensity: 0.2"></a-entity>
      
      <a-entity visible="true" position="0 0 -2" scale="3 3 3">
        <a-entity rotation="-90 0 0" position="-0.203 0.883 0" light="type: spot; decay: 0.1; distance: 100; angle: 180; penumbra: .85; intensity: 0.2"></a-entity>
        <a-entity rotation="-90 0 0" position="-0.203 0.883 0" light="type: spot; decay: 0.1; distance: 5; angle: 30; intensity: 0.6"></a-entity>
        <a-entity gltf-model="#streetlight"></a-entity>
      </a-entity>

      <a-plane roughness=".5" metalness="0" position=".5 0.01 0" rotation="-90 0 0" width="6" height="10000" color="black"></a-plane>
      <a-plane position=".6 0.1 0" rotation="-90 0 0" width="0.1" height="10000" color="yellow"></a-plane>
      <a-plane position=".4 0.1 0" rotation="-90 0 0" width="0.1" height="10000" color="yellow"></a-plane>
      
      <a-plane color="#080808" position="0 -0.1 0" rotation="-90 0 0" width="10000" height="10000"></a-plane>
      <a-sky material-fog="false" radius="10000" src="#sky"></a-sky>
      
    </a-scene>
    
  </body>
</html>
